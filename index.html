<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080a0d">

<title>ROWE Tech Support</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080a0d;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
}

.container {
    width: 100%;
    max-width: 1100px;
    margin: auto;
    padding: 18px;
}

header {
    text-align: center;
    padding: 10px 0 20px;
}

.logo {
    width: 100%;
    max-width: 520px;
    max-height: 190px;
    object-fit: contain;
}

.subtitle {
    color: #9da5ae;
    font-size: 12px;
    letter-spacing: 2px;
    margin-top: 8px;
}

.search {
    display: flex;
    gap: 10px;
    margin: 20px 0;
    background: #15191e;
    border: 1px solid #39434d;
    padding: 10px;
    border-radius: 14px;
}

.search input {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    outline: none;
    color: white;
    font-size: 17px;
    padding: 10px;
}

button,
.source-button {
    background: #252c33;
    color: white;
    border: 1px solid #46515c;
    border-radius: 10px;
    padding: 13px 16px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    text-decoration: none;
}

.blue {
    background: #1677d2;
    border-color: #318de0;
}

h2 {
    color: #b7bec6;
    font-size: 17px;
    letter-spacing: 1px;
    margin: 20px 0 12px;
}

.manufacturers {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.manufacturer {
    min-height: 65px;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 12px;
}

.icon {
    color: #48a5ff;
    font-size: 22px;
}

.arrow {
    margin-left: auto;
    color: #8e98a2;
    font-size: 22px;
}

.info {
    background: #15191e;
    border: 1px solid #39434d;
    border-radius: 14px;
    padding: 17px;
    margin-top: 20px;
    color: #9da5ae;
    line-height: 1.5;
}

.info strong {
    color: #48a5ff;
}

#searchResults {
    display: none;
}

.result {
    display: block;
    background: #20262c;
    border: 1px solid #3a454f;
    border-radius: 10px;
    padding: 14px;
    margin: 8px 0;
    color: white;
    text-decoration: none;
}

.result small {
    display: block;
    color: #8f99a3;
    margin-top: 5px;
}

.library {
    display: none;
    position: fixed;
    inset: 0;
    background: #080a0d;
    z-index: 100;
}

.library-header {
    height: 60px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px;
    background: #11151a;
    border-bottom: 1px solid #39434d;
}

.library-title {
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-weight: bold;
}

.library iframe {
    width: 100%;
    height: calc(100% - 60px);
    border: none;
    background: white;
}

@media(max-width:700px) {
    .manufacturers {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media(max-width:450px) {
    .manufacturers {
        grid-template-columns: 1fr;
    }

    .search {
        flex-direction: column;
    }

    .search button {
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="container">

<header>

<img src="rowe-logo.png"
     class="logo"
     alt="ROWE Tech Support">

<div class="subtitle">
AUTOMATIC DOOR TECHNICAL REFERENCE
</div>

<div class="search">

<input
    id="searchBox"
    type="search"
    placeholder="Search manufacturer, model, or manual..."
>

<button class="blue" onclick="searchLibrary()">
SEARCH
</button>

</div>

</header>


<main id="home">

<h2>BROWSE BY MANUFACTURER</h2>

<div class="manufacturers" id="manufacturerList"></div>

<div class="info">

<strong>LIVE TECHNICAL LIBRARY</strong>

<br><br>

Browse the current manufacturer directories and open the
original manuals directly from their source location.

<br><br>

<a
class="source-button blue"
target="_blank"
href="https://www.addisonautomatics.com/wp-content/uploads/manuals/">

OPEN COMPLETE SOURCE LIBRARY

</a>

</div>

</main>


<section id="searchResults">

<button onclick="goHome()">
← BACK
</button>

<h2>SEARCH</h2>

<div id="results"></div>

</section>

</div>


<div class="library" id="library">

<div class="library-header">

<button onclick="closeLibrary()">
← BACK
</button>

<div class="library-title" id="libraryTitle">
MANUAL LIBRARY
</div>

<a
id="openSource"
class="source-button"
target="_blank">

OPEN

</a>

</div>

<iframe id="libraryFrame"></iframe>

</div>


<script>

const ROOT =
"https://www.addisonautomatics.com/wp-content/uploads/manuals/";

const manufacturers = [

"BEA",
"Besam",
"Detex",
"DOM",
"Dorma",
"Gildor",
"Horton",
"Hunter-Entrematic",
"KM",
"LCN",
"Motion Access",
"Nabco_GyroTech",
"Norton",
"Optex",
"Record",
"Stanley",
"TJ084",
"Tormax",
"Tucker"

];


function escapeHTML(text) {

return text
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function makeURL(name) {

return ROOT +
encodeURIComponent(name) +
"/";

}


function loadManufacturers() {

const list =
document.getElementById("manufacturerList");

list.innerHTML = "";

manufacturers.forEach(function(name) {

const button =
document.createElement("button");

button.className =
"manufacturer";

button.innerHTML =
'<span class="icon">▱</span>' +
'<span>' +
escapeHTML(name) +
'</span>' +
'<span class="arrow">›</span>';

button.onclick = function() {

openLibrary(
name,
makeURL(name)
);

};

list.appendChild(button);

});

}


function openLibrary(name,url) {

document.getElementById(
"libraryTitle"
).textContent =
name + " Library";

document.getElementById(
"openSource"
).href = url;

document.getElementById(
"libraryFrame"
).src = url;

document.getElementById(
"library"
).style.display = "block";

document.body.style.overflow =
"hidden";

}


function closeLibrary() {

document.getElementById(
"libraryFrame"
).src =
"about:blank";

document.getElementById(
"library"
).style.display =
"none";

document.body.style.overflow =
"";

}


function goHome() {

document.getElementById(
"searchResults"
).style.display =
"none";

document.getElementById(
"home"
).style.display =
"block";

}


function searchLibrary() {

const query =
document.getElementById(
"searchBox"
).value.trim();

if (!query) return;


document.getElementById(
"home"
).style.display =
"none";

document.getElementById(
"searchResults"
).style.display =
"block";


const results =
document.getElementById(
"results"
);

results.innerHTML = "";


const q =
query.toLowerCase();


const matches =
manufacturers.filter(function(name) {

return name.toLowerCase().includes(q);

});


matches.forEach(function(name) {

const result =
document.createElement("a");

result.className =
"result";

result.href = "#";

result.innerHTML =
"▱ " +
escapeHTML(name) +
"<small>Open manufacturer library</small>";

result.onclick =
function(event) {

event.preventDefault();

openLibrary(
name,
makeURL(name)
);

};

results.appendChild(result);

});


const webSearch =
document.createElement("a");

webSearch.className =
"result";

webSearch.target =
"_blank";

webSearch.href =
"https://www.google.com/search?q=" +
encodeURIComponent(
'site:addisonautomatics.com/wp-content/uploads/manuals "' +
query +
'"'
);

webSearch.innerHTML =
"🔎 Search Complete Manual Library" +
"<small>" +
escapeHTML(query) +
"</small>";

results.appendChild(webSearch);


if (!matches.length) {

const message =
document.createElement("div");

message.className =
"info";

message.innerHTML =
"No manufacturer match found.<br><br>" +
"Use the search result below to search the complete live manual library.";

results.insertBefore(
message,
results.firstChild
);

}

}


loadManufacturers();

</script>

</body>
</html>
