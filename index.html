<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ROWE Tech Support</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#07090b;
color:#f4f7fa;
font-family:Arial,Helvetica,sans-serif;
}

.wrap{
max-width:980px;
margin:auto;
padding:28px 18px 60px;
}

.banner{
height:185px;
border:1px solid #17639b;
border-radius:3px;
background:radial-gradient(circle at 75%,#07518a,#06111a 58%);
display:grid;
place-items:center;
font-size:42px;
font-weight:900;
letter-spacing:5px;
}

.banner span{
color:#58b0ff;
}

.kicker{
text-align:center;
color:#aeb8c1;
letter-spacing:5px;
font-size:17px;
margin:28px 0 34px;
}

.search{
background:#15191e;
border:2px solid #35414b;
border-radius:28px;
padding:14px 18px;
}

.search input{
width:100%;
background:transparent;
border:0;
outline:0;
color:#fff;
font-size:20px;
padding:12px;
}

.search button{
width:100%;
margin-top:10px;
background:#2187df;
color:#fff;
border:1px solid #45a4f2;
border-radius:15px;
padding:16px;
font-size:20px;
font-weight:800;
}

.back{
background:#283039;
border:1px solid #4a5863;
color:white;
border-radius:12px;
padding:14px 20px;
font-size:17px;
font-weight:800;
cursor:pointer;
}

h1{
margin:0;
font-size:34px;
}

h2{
margin-top:28px;
font-size:21px;
}

p{
color:#9aa7b2;
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:13px;
}

.maker,
.folder{
background:#11161b;
color:#fff;
border:1px solid #2d3943;
border-radius:13px;
padding:19px;
text-align:left;
cursor:pointer;
}

.maker:hover,
.folder:hover{
border-color:#4a9ad7;
}

.maker b{
display:block;
font-size:18px;
}

.maker span{
display:block;
color:#9aa7b2;
font-size:12px;
margin-top:5px;
}

.maker em{
display:block;
color:#58b0ff;
font-style:normal;
font-size:12px;
margin-top:15px;
}

.crumb{
display:flex;
align-items:center;
gap:15px;
margin:22px 0;
}

.doc{
display:flex;
align-items:center;
gap:14px;
background:#11161b;
border:1px solid #2d3943;
border-radius:12px;
padding:15px;
margin:9px 0;
}

.doc>strong{
background:#252e36;
padding:8px;
border-radius:5px;
font-size:10px;
}

.doc div{
flex:1;
}

.doc small{
display:block;
color:#8e9aa4;
margin-top:4px;
}

.doc a,
.live{
color:#fff;
background:#222a31;
border:1px solid #45535e;
border-radius:8px;
padding:9px 12px;
text-decoration:none;
font-size:12px;
}

.notice{
padding:18px;
background:#11171c;
border:1px dashed #3b4853;
border-radius:12px;
color:#aab5bf;
line-height:1.5;
}

footer{
text-align:center;
color:#6d7a84;
font-size:12px;
margin-top:55px;
}

@media(max-width:700px){
.grid{
grid-template-columns:repeat(2,1fr);
}

.banner{
height:150px;
font-size:30px;
}
}

@media(max-width:480px){
.grid{
grid-template-columns:1fr;
}

.kicker{
font-size:12px;
letter-spacing:3px;
}

h1{
font-size:30px;
}
}
</style>
</head>

<body>

<div class="wrap">

<div class="banner">
ROWE <span>TECH SUPPORT</span>
</div>

<div class="kicker">
AUTOMATIC DOOR TECHNICAL REFERENCE
</div>

<div class="search">

<input
id="search"
placeholder="Search manufacturer, model, or manual..."
oninput="searchDocs()"
>

<button onclick="searchDocs()">
SEARCH
</button>

</div>

<div id="app"></div>

<footer>
ROWE Tech Support • Independent technical reference • Source: Addison Automatics
</footer>

</div>


<script>

const BASE =
"https://www.addisonautomatics.com/wp-content/uploads/manuals/";


/* =========================================
   MANUFACTURERS
========================================= */

const manufacturers = [

"BEA",
"Besam",
"Detex",
"DOM",
"Dorma",
"Gildor",
"Horton",
"Hunter-Entrematic",
"KM",
"LCN",
"Motion Access",
"Nabco GyroTech",
"Norton",
"Optex",
"Record",
"Stanley",
"TJ084",
"Tormax",
"Tucker"

];


/* =========================================
   DORMA DOCUMENTS
========================================= */

const catalog = {

"Dorma":{

folders:[
"Slider",
"Swinger"
],

files:[

["ED100 / ED250","ED100 & ED250 Mounting Instructions 02-21-12.pdf"],

["ED100 / ED250","ED100 & ED250.pdf"],

["ED400","ED400 - ControllerManual.pdf"],

["ED400","ED400 OHC.pdf"],

["ED400","ED400 SA.pdf"],

["ED700","ED700 NS Digital.pdf"],

["ED700","ED700 OLD STYLE.pdf"],

["ED800","ED800 INSTALLATION.pdf"],

["ED800","ED800 SERVICE.pdf"],

["ED900","ED900 PROGRAMMING.pdf"],

["ED900","ED900.pdf"],

["ED900","ED900DoorOperatorInstal-0114 THIS ONE.pdf"],

["ESA","ESA 100.pdf"],

["ESA","ESA 200.pdf"],

["ESA","ESA 300 w ESA II 1-07.pdf"],

["ESA","ESA 400.pdf"],

["ESA","ESA II FULL MANUAL.pdf"],

["ESA","ESA I WIRING.pdf"],

["Parts","OLD DORMA PARTS CATALOG.pdf"],

["Programming","Program Switches.pdf"],

["ICU","DORMA ICU 300.pdf"],

["ICU","DORMA ICU 300 TRACKLESS.pdf"]

]

},


/* =========================================
   BESAM
========================================= */

"Besam":{

folders:[
"Fold",
"ICU",
"Revolver",
"Slider",
"Swinger"
],

files:[

["Root","BIG BLUE BESAM PARTS BOOK.pdf"]

]

},


/* =========================================
   RECORD
========================================= */

"Record":{

folders:[],

files:[

["Root","4500 FOLD SYS 20.pdf"],

["Root","5100 SYSTEM 19.pdf"],

["Root","6100 INSTALL MANUAL.pdf"],

["Root","8100 INSTALL SWINGER.pdf"],

["Root","Alarm&Error Messages.pdf"],

["Root","PARAMETER ERROR CODE EXPLANATIONS.pdf"],

["Root","SWINGER PROGRAMMING A PAIR.pdf"],

["Root","SYSTEM 20 PARAMETERS.pdf"]

]

},


/* =========================================
   TORMAX
========================================= */

"Tormax":{

folders:[],

files:[

["Root","SLIDER I MOTION.pdf"],

["Root","SLIDER TCP51.pdf"],

["Root","SWINGER 1102 1201.pdf"],

["Root","SWINGER NEW 1102 1201.pdf"],

["Root","SWINGER TDA.pdf"],

["Root","TX9000 SLIDER PARTS CATALOG.pdf"],

["Root","US801279_1301_Installation_and_Operating_Manual_V6.17.pdf"]

]

}

};


/* =========================================
   CLEAN URL ENCODING
========================================= */

function encodePath(value){

return encodeURIComponent(value);

}


/* =========================================
   MANUFACTURER DIRECTORY
========================================= */

function manufacturerFolder(name){

const folderNames={

"BEA":"BEA",

"Besam":"Besam",

"Detex":"Detex",

"DOM":"DOM",

"Dorma":"Dorma",

"Gildor":"Gildor",

"Horton":"Horton",

"Hunter-Entrematic":"Hunter-Entrematic",

"KM":"KM",

"LCN":"LCN",

"Motion Access":"Motion%20Access",

"Nabco GyroTech":"Nabco_GyroTech",

"Norton":"Norton",

"Optex":"Optex",

"Record":"record",

"Stanley":"Stanley",

"TJ084":"TJ084",

"Tormax":"Tormax",

"Tucker":"Tucker"

};

return folderNames[name] || name;

}


/* =========================================
   HOME
========================================= */

function home(){

let cards="";

manufacturers.forEach(function(name){

cards+=`

<button
class="maker"
onclick="openMaker('${name}')"
>

<b>${name}</b>

<span>
Automatic door technical documentation
</span>

<em>
Open →
</em>

</button>

`;

});

document.getElementById("app").innerHTML=`

<h2>
MANUFACTURER LIBRARY
</h2>

<p>
Select a manufacturer. Folder names and document names stay clean and separate.
</p>

<div class="grid">
${cards}
</div>

`;

}


/* =========================================
   OPEN MANUFACTURER
========================================= */

function openMaker(name){

const data=catalog[name];

let html=`

<div class="crumb">

<button
class="back"
onclick="home()"
>
← BACK
</button>

<h1>
${name}
</h1>

</div>

`;


/* -----------------------------------------
   FOLDERS
----------------------------------------- */

if(data && data.folders.length){

html+=`

<h2>
FOLDERS
</h2>

<div class="grid">

`;

data.folders.forEach(function(folder){

html+=`

<button
class="folder"
onclick="openFolder('${name}','${folder}')"
>

📁

<b>
${folder}
</b>

</button>

`;

});

html+=`

</div>

`;

}


/* -----------------------------------------
   DOCUMENTS
----------------------------------------- */

if(data && data.files.length){

html+=`

<h2>
DOCUMENTS
</h2>

`;

data.files.forEach(function(file){

html+=createDocument(
name,
file[1],
file[0]
);

});

}


/* -----------------------------------------
   OTHER MANUFACTURERS
----------------------------------------- */

if(!data){

html+=`

<div class="notice">

This manufacturer is available as a live Addison directory.

Its complete file list can be indexed into the app without changing the interface.

</div>

`;

}


/* -----------------------------------------
   LIVE DIRECTORY
----------------------------------------- */

html+=`

<p>

<a
class="live"
href="${BASE}${encodePath(manufacturerFolder(name))}/"
target="_blank"
>

OPEN LIVE ${name} DIRECTORY ↗

</a>

</p>

`;


document.getElementById("app").innerHTML=html;

}


/* =========================================
   OPEN FOLDER
========================================= */

function openFolder(manufacturer,folder){

const data=catalog[manufacturer];

let files=[];

if(data){

files=data.files.filter(function(file){

return file[0].toLowerCase() ===
folder.toLowerCase();

});

}


let html=`

<div class="crumb">

<button
class="back"
onclick="openMaker('${manufacturer}')"
>
← BACK
</button>

<h1>
${folder}
</h1>

</div>

<p>
${manufacturer} / ${folder}
</p>

`;


if(files.length){

files.forEach(function(file){

html+=createDocument(
manufacturer,
file[1],
folder
);

});

}else{

html+=`

<div class="notice">

This folder is recognized by the app.

Its live Addison directory is available below.

</div>

`;

}


html+=`

<p>

<a
class="live"
href="${BASE}${encodePath(manufacturerFolder(manufacturer))}/${encodePath(folder)}/"
target="_blank"
>

OPEN LIVE FOLDER ↗

</a>

</p>

`;


document.getElementById("app").innerHTML=html;

}


/* =========================================
   CREATE DOCUMENT
========================================= */

function createDocument(
manufacturer,
file,
folder
){

let manufacturerFolderName =
manufacturerFolder(manufacturer);

let url =
BASE +
manufacturerFolderName +
"/";


if(folder && folder !== "Root"){

url += encodePath(folder) + "/";

}


url += encodePath(file);


return `

<div class="doc">

<strong>
PDF
</strong>

<div>

<b>
${file}
</b>

<small>

${manufacturer}

${folder && folder !== "Root"
? " / " + folder
: ""}

</small>

</div>

<a
href="${url}"
target="_blank"
>

OPEN PDF ↗

</a>

</div>

`;

}


/* =========================================
   SEARCH
========================================= */

function searchDocs(){

const query =
document.getElementById("search")
.value
.trim()
.toLowerCase();


if(!query){

home();

return;

}


let results=[];


for(const manufacturer in catalog){

const data=catalog[manufacturer];


data.files.forEach(function(file){

const searchText=

manufacturer +
" " +
file[0] +
" " +
file[1];


if(
searchText
.toLowerCase()
.includes(query)
){

results.push(

createDocument(
manufacturer,
file[1],
file[0]
)

);

}

});

}


document.getElementById("app").innerHTML=`

<div class="crumb">

<button
class="back"
onclick="home()"
>
← BACK
</button>

<h1>
SEARCH
</h1>

</div>

<p>
${results.length} indexed document matches
</p>

${
results.length
?
results.join("")
:
`

<div class="notice">

No indexed document matched that search.

<br><br>

Try:

<strong>
Dorma
</strong>,

<strong>
ED900
</strong>,

<strong>
ED700
</strong>,

<strong>
Besam
</strong>,

<strong>
Record
</strong>

or

<strong>
Tormax
</strong>.

</div>

`

}

`;

}


/* =========================================
   START APP
========================================= */

home();

</script>

</body>
</html>
