<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ROWE Tech Support</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#07090b;
color:#f4f7fa;
font-family:Arial,Helvetica,sans-serif;
}

.wrap{
max-width:980px;
margin:auto;
padding:28px 18px 60px;
}

.banner{
height:185px;
border:1px solid #17639b;
border-radius:3px;
background:radial-gradient(circle at 75%,#07518a,#06111a 58%);
display:grid;
place-items:center;
font-size:42px;
font-weight:900;
letter-spacing:5px;
}

.banner span{
color:#58b0ff;
}

.kicker{
text-align:center;
color:#aeb8c1;
letter-spacing:5px;
font-size:17px;
margin:28px 0 34px;
}

.search{
background:#15191e;
border:2px solid #35414b;
border-radius:28px;
padding:14px 18px;
}

.search input{
width:100%;
background:transparent;
border:0;
outline:0;
color:#fff;
font-size:20px;
padding:12px;
}

.search button{
width:100%;
margin-top:10px;
background:#2187df;
color:#fff;
border:1px solid #45a4f2;
border-radius:15px;
padding:16px;
font-size:20px;
font-weight:800;
cursor:pointer;
}

.back{
background:#283039;
border:1px solid #4a5863;
color:white;
border-radius:12px;
padding:14px 20px;
font-size:17px;
font-weight:800;
cursor:pointer;
}

h1{
margin:0;
font-size:34px;
}

h2{
margin-top:28px;
font-size:21px;
}

p{
color:#9aa7b2;
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:13px;
}

.maker,
.folder{
background:#11161b;
color:#fff;
border:1px solid #2d3943;
border-radius:13px;
padding:19px;
text-align:left;
cursor:pointer;
}

.maker:hover,
.folder:hover{
border-color:#4a9ad7;
}

.maker b{
display:block;
font-size:18px;
}

.maker span{
display:block;
color:#9aa7b2;
font-size:12px;
margin-top:5px;
}

.maker em{
display:block;
color:#58b0ff;
font-style:normal;
font-size:12px;
margin-top:15px;
}

.crumb{
display:flex;
align-items:center;
gap:15px;
margin:22px 0;
}

.doc{
display:flex;
align-items:center;
gap:14px;
background:#11161b;
border:1px solid #2d3943;
border-radius:12px;
padding:15px;
margin:9px 0;
}

.doc>strong{
background:#252e36;
padding:8px;
border-radius:5px;
font-size:10px;
}

.doc div{
flex:1;
min-width:0;
}

.doc b{
word-break:break-word;
}

.doc small{
display:block;
color:#8e9aa4;
margin-top:4px;
}

.doc a,
.live{
color:#fff;
background:#222a31;
border:1px solid #45535e;
border-radius:8px;
padding:9px 12px;
text-decoration:none;
font-size:12px;
white-space:nowrap;
}

.doc a:hover,
.live:hover{
border-color:#58b0ff;
}

.notice{
padding:18px;
background:#11171c;
border:1px dashed #3b4853;
border-radius:12px;
color:#aab5bf;
line-height:1.5;
}

.loading{
padding:25px;
text-align:center;
color:#9aa7b2;
}

footer{
text-align:center;
color:#6d7a84;
font-size:12px;
margin-top:55px;
}

@media(max-width:700px){
.grid{
grid-template-columns:repeat(2,1fr);
}

.banner{
height:150px;
font-size:30px;
}
}

@media(max-width:480px){
.grid{
grid-template-columns:1fr;
}

.kicker{
font-size:12px;
letter-spacing:3px;
}

h1{
font-size:30px;
}

.crumb{
gap:10px;
}

.doc{
align-items:flex-start;
flex-wrap:wrap;
}

.doc a{
margin-left:48px;
}

}
</style>
</head>

<body>

<div class="wrap">

<div class="banner">
ROWE <span>TECH SUPPORT</span>
</div>

<div class="kicker">
AUTOMATIC DOOR TECHNICAL REFERENCE
</div>

<div class="search">

<input
id="search"
placeholder="Search manufacturer, model, or manual..."
oninput="searchDocs()"
>

<button onclick="searchDocs()">
SEARCH
</button>

</div>

<div id="app"></div>

<footer>
ROWE Tech Support • Independent technical reference • Source: Addison Automatics
</footer>

</div>


<script>

/* =========================================================
   ROWE TECH SUPPORT
   LIVE ADDISON DIRECTORY ENGINE
========================================================= */

const BASE =
"https://www.addisonautomatics.com/wp-content/uploads/manuals/";

/*
   Jina is used ONLY to READ the Addison directory listing.

   PDF FILES ARE NEVER SENT THROUGH JINA.

   When a PDF is opened, the app uses the original Addison
   URL that came from the directory listing.
*/
const PROXY =
"https://r.jina.ai/http://www.addisonautomatics.com/wp-content/uploads/manuals/";


/* =========================================================
   MANUFACTURERS

   These are the actual manufacturer directories.
========================================================= */

const manufacturers = [

"BEA",
"Besam",
"Detex",
"DOM",
"Dorma",
"Gildor",
"Horton",
"Hunter-Entrematic",
"KM",
"LCN",
"Motion Access",
"Nabco GyroTech",
"Norton",
"Optex",
"Record",
"Stanley",
"TJ084",
"Tormax",
"Tucker"

];


/* =========================================================
   ACTUAL ADDISON DIRECTORY NAMES

   The displayed manufacturer name and actual folder name
   are kept separate.

   This prevents things like:

   Nabco GyroTech -> Nabco_GyroTech

   from appearing incorrectly in the GUI.
========================================================= */

const manufacturerPaths = {

"BEA":"BEA/",
"Besam":"Besam/",
"Detex":"Detex/",
"DOM":"DOM/",
"Dorma":"Dorma/",
"Gildor":"Gildor/",
"Horton":"Horton/",
"Hunter-Entrematic":"Hunter-Entrematic/",
"KM":"KM/",
"LCN":"LCN/",
"Motion Access":"Motion%20Access/",
"Nabco GyroTech":"Nabco_GyroTech/",
"Norton":"Norton/",
"Optex":"Optex/",
"Record":"record/",
"Stanley":"Stanley/",
"TJ084":"TJ084/",
"Tormax":"Tormax/",
"Tucker":"Tucker/"

};


/* =========================================================
   CACHE

   Once a directory has been read, keep it in memory so
   going back and forth doesn't repeatedly request it.
========================================================= */

const directoryCache = new Map();


/* =========================================================
   CURRENT NAVIGATION
========================================================= */

let navigationStack = [];


/* =========================================================
   HTML SAFETY
========================================================= */

function escapeHTML(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================================================
   GET MANUFACTURER DIRECTORY URL
========================================================= */

function manufacturerURL(name){

const path =
manufacturerPaths[name] || encodeURIComponent(name) + "/";

return BASE + path;

}


/* =========================================================
   PROXY DIRECTORY URL
========================================================= */

function proxyURL(url){

return "https://r.jina.ai/http://" +
url.replace(/^https?:\/\//i,"");

}


/* =========================================================
   NORMALIZE URL

   This is the important part.

   The URL is resolved against the ORIGINAL Addison
   directory URL.

   Nothing is rebuilt from the visible filename.
========================================================= */

function resolveOriginalURL(href,currentURL){

try{

return new URL(
href,
currentURL
).href;

}catch(error){

return href;

}

}


/* =========================================================
   DETERMINE IF LINK IS A PDF
========================================================= */

function isPDF(url,name){

const value =
(String(url || "") + " " + String(name || ""))
.toLowerCase();

return (
value.includes(".pdf") ||
value.includes(".pdf?")
);

}


/* =========================================================
   DETERMINE IF LINK IS A DIRECTORY
========================================================= */

function isDirectory(href,name){

const h = String(href || "");
const n = String(name || "");

if(h === "../") return false;

if(isPDF(h,n)) return false;

return (
h.endsWith("/") ||
n.endsWith("/") ||
(!h.includes(".") && !n.includes("."))
);

}


/* =========================================================
   CLEAN DISPLAY NAME

   Only cleans the text shown to the user.

   It DOES NOT alter the actual URL.
========================================================= */

function cleanDisplayName(value){

let name =
String(value || "")
.trim();

name =
name.replace(/\/$/,"");

try{

name =
decodeURIComponent(name);

}catch(e){}

return name.trim();

}


/* =========================================================
   PARSE HTML DIRECTORY LISTING

   Handles Apache-style directory listings.
========================================================= */

function parseHTMLLinks(text,currentURL){

const results=[];
const seen=new Set();

const parser =
new DOMParser();

const doc =
parser.parseFromString(
text,
"text/html"
);

const anchors =
Array.from(
doc.querySelectorAll("a[href]")
);

anchors.forEach(function(anchor){

const href =
anchor.getAttribute("href");

if(!href) return;

const rawName =
anchor.textContent.trim();

const fullURL =
resolveOriginalURL(
href,
currentURL
);

if(
!fullURL ||
fullURL === currentURL
) return;

if(
href === "../" ||
rawName === "../"
) return;

let name =
cleanDisplayName(
rawName || href
);

if(!name) return;

const key =
fullURL.toLowerCase();

if(seen.has(key)) return;

seen.add(key);

results.push({

name:name,
url:fullURL,
folder:isDirectory(href,name),
pdf:isPDF(href,name)

});

});

return results;

}


/* =========================================================
   PARSE MARKDOWN LINKS

   Jina sometimes converts the directory into Markdown.

   This parser handles that format too.
========================================================= */

function parseMarkdownLinks(text,currentURL){

const results=[];
const seen=new Set();

const regex =
/\[[^\]]+\]\(([^)]+)\)/g;

let match;

while(
(match = regex.exec(text))
!== null
){

let fullMatch =
match[0];

let href =
match[1];

let name =
fullMatch
.substring(
1,
fullMatch.indexOf("]")
);

if(!href) continue;

if(
href.startsWith("<") &&
href.endsWith(">")
){

href =
href.slice(1,-1);

}

if(
href === "../" ||
name === "../"
) continue;

const fullURL =
resolveOriginalURL(
href,
currentURL
);

if(!fullURL) continue;

const key =
fullURL.toLowerCase();

if(seen.has(key)) continue;

seen.add(key);

name =
cleanDisplayName(
name || href
);

results.push({

name:name,
url:fullURL,
folder:isDirectory(href,name),
pdf:isPDF(href,name)

});

}

return results;

}


/* =========================================================
   PARSE DIRECTORY

   First tries real HTML anchors.

   If that doesn't work, tries Markdown.
========================================================= */

function parseDirectory(text,currentURL){

let results =
parseHTMLLinks(
text,
currentURL
);

if(results.length > 0){

return results;

}

return parseMarkdownLinks(
text,
currentURL
);

}


/* =========================================================
   FETCH DIRECTORY

   Only directory HTML is proxied.

   Original Addison links remain untouched.
========================================================= */

async function getDirectory(url){

if(directoryCache.has(url)){

return directoryCache.get(url);

}

const requestURL =
proxyURL(url);

const response =
await fetch(
requestURL,
{
cache:"no-store"
}
);

if(!response.ok){

throw new Error(
"Directory request failed: " +
response.status
);

}

const text =
await response.text();

const items =
parseDirectory(
text,
url
);

directoryCache.set(
url,
items
);

return items;

}


/* =========================================================
   HOME
========================================================= */

function home(){

navigationStack=[];

document.getElementById("search").value="";

let cards="";

manufacturers.forEach(function(name){

cards+=`

<button
class="maker"
onclick="openMaker(${JSON.stringify(name)})"
>

<b>${escapeHTML(name)}</b>

<span>
Automatic door technical documentation
</span>

<em>
Open →
</em>

</button>

`;

});

document.getElementById("app").innerHTML=`

<h2>
MANUFACTURER LIBRARY
</h2>

<p>
Select a manufacturer to browse its live Addison directory.
</p>

<div class="grid">
${cards}
</div>

`;

}


/* =========================================================
   BACK BUTTON
========================================================= */

function back(){

if(navigationStack.length <= 1){

home();

return;

}

navigationStack.pop();

const previous =
navigationStack[
navigationStack.length - 1
];

if(previous.type === "maker"){

openMaker(
previous.name,
false
);

return;

}

if(previous.type === "folder"){

openFolder(
previous.manufacturer,
previous.name,
previous.url,
false
);

}

}


/* =========================================================
   OPEN MANUFACTURER
========================================================= */

async function openMaker(
name,
pushHistory=true
){

const url =
manufacturerURL(name);

if(pushHistory){

navigationStack.push({

type:"maker",
name:name,
url:url

});

}

document.getElementById("app").innerHTML=`

<div class="crumb">

<button
class="back"
onclick="back()"
>
← BACK
</button>

<h1>
${escapeHTML(name)}
</h1>

</div>

<div class="loading">
Loading ${escapeHTML(name)} directory...
</div>

`;

try{

const items =
await getDirectory(url);

renderDirectory(
name,
url,
items
);

}catch(error){

renderDirectoryError(
name,
url,
error
);

}

}


/* =========================================================
   RENDER DIRECTORY
========================================================= */

function renderDirectory(
manufacturer,
currentURL,
items
){

const folders =
items.filter(
item => item.folder
);

const pdfs =
items.filter(
item => item.pdf
);

let html=`

<div class="crumb">

<button
class="back"
onclick="back()"
>
← BACK
</button>

<h1>
${escapeHTML(manufacturer)}
</h1>

</div>

`;

if(folders.length){

html+=`

<h2>
FOLDERS
</h2>

<div class="grid">

`;

folders.forEach(function(item){

html+=`

<button
class="folder"
onclick='openFolder(
${JSON.stringify(manufacturer)},
${JSON.stringify(item.name)},
${JSON.stringify(item.url)}
)'
>

📁
<b>
${escapeHTML(item.name)}
</b>

</button>

`;

});

html+=`

</div>

`;

}


if(pdfs.length){

html+=`

<h2>
DOCUMENTS
</h2>

`;

pdfs.forEach(function(item){

html+=createDocument(

manufacturer,

item.name,

item.url,

""

);

});

}


if(
!folders.length &&
!pdfs.length
){

html+=`

<div class="notice">

No documents or folders were found in this directory.

<br><br>

<a
class="live"
href="${escapeHTML(currentURL)}"
target="_blank"
rel="noopener"
>
OPEN ORIGINAL DIRECTORY ↗
</a>

</div>

`;

}


html+=`

<p>

<a
class="live"
href="${escapeHTML(currentURL)}"
target="_blank"
rel="noopener"
>
OPEN LIVE ${escapeHTML(manufacturer)} DIRECTORY ↗
</a>

</p>

`;

document.getElementById("app").innerHTML=html;

}


/* =========================================================
   OPEN FOLDER
========================================================= */

async function openFolder(
manufacturer,
folderName,
folderURL,
pushHistory=true
){

if(pushHistory){

navigationStack.push({

type:"folder",
manufacturer:manufacturer,
name:folderName,
url:folderURL

});

}

document.getElementById("app").innerHTML=`

<div class="crumb">

<button
class="back"
onclick="back()"
>
← BACK
</button>

<h1>
${escapeHTML(folderName)}
</h1>

</div>

<p>
${escapeHTML(manufacturer)}
 / 
${escapeHTML(folderName)}
</p>

<div class="loading">
Loading folder...
</div>

`;

try{

const items =
await getDirectory(folderURL);

const folders =
items.filter(
item => item.folder
);

const pdfs =
items.filter(
item => item.pdf
);

let html="";


if(folders.length){

html+=`

<h2>
FOLDERS
</h2>

<div class="grid">

`;

folders.forEach(function(item){

html+=`

<button
class="folder"
onclick='openFolder(
${JSON.stringify(manufacturer)},
${JSON.stringify(item.name)},
${JSON.stringify(item.url)}
)'
>

📁
<b>
${escapeHTML(item.name)}
</b>

</button>

`;

});

html+=`

</div>

`;

}


if(pdfs.length){

html+=`

<h2>
DOCUMENTS
</h2>

`;

pdfs.forEach(function(item){

html+=createDocument(

manufacturer,

item.name,

item.url,

folderName

);

});

}


if(
!folders.length &&
!pdfs.length
){

html+=`

<div class="notice">

No documents were found in this folder.

<br><br>

<a
class="live"
href="${escapeHTML(folderURL)}"
target="_blank"
rel="noopener"
>
OPEN ORIGINAL FOLDER ↗
</a>

</div>

`;

}


html+=`

<p>

<a
class="live"
href="${escapeHTML(folderURL)}"
target="_blank"
rel="noopener"
>
OPEN LIVE FOLDER ↗
</a>

</p>

`;

document.getElementById("app").innerHTML=`

<div class="crumb">

<button
class="back"
onclick="back()"
>
← BACK
</button>

<h1>
${escapeHTML(folderName)}
</h1>

</div>

<p>
${escapeHTML(manufacturer)}
 / 
${escapeHTML(folderName)}
</p>

${html}

`;

}catch(error){

renderDirectoryError(
folderName,
folderURL,
error
);

}

}


/* =========================================================
   CREATE DOCUMENT

   IMPORTANT:

   "url" is the EXACT ORIGINAL URL found in the Addison
   directory.

   We do NOT rebuild it from manufacturer + filename.
========================================================= */

function createDocument(
manufacturer,
fileName,
originalURL,
folder
){

return `

<div class="doc">

<strong>
PDF
</strong>

<div>

<b>
${escapeHTML(fileName)}
</b>

<small>

${escapeHTML(manufacturer)}

${folder
? " / " + escapeHTML(folder)
: ""}

</small>

</div>

<a
href="${escapeHTML(originalURL)}"
target="_blank"
rel="noopener"
>
OPEN PDF ↗
</a>

</div>

`;

}


/* =========================================================
   ERROR DISPLAY
========================================================= */

function renderDirectoryError(
name,
url,
error
){

document.getElementById("app").innerHTML=`

<div class="crumb">

<button
class="back"
onclick="back()"
>
← BACK
</button>

<h1>
${escapeHTML(name)}
</h1>

</div>

<div class="notice">

Unable to read this directory automatically.

<br><br>

This does not mean the Addison files are missing.

<br><br>

<a
class="live"
href="${escapeHTML(url)}"
target="_blank"
rel="noopener"
>
OPEN ORIGINAL DIRECTORY ↗
</a>

</div>

`;

console.error(error);

}


/* =========================================================
   SEARCH

   Search the directories that have already been opened.

   If the user searches before opening a manufacturer,
   we automatically search all manufacturer directories.

   Results use the ORIGINAL ADDISON PDF URL.
========================================================= */

let searchTimer=null;

async function searchDocs(){

clearTimeout(searchTimer);

searchTimer =
setTimeout(
performSearch,
250
);

}


async function performSearch(){

const query =
document.getElementById("search")
.value
.trim()
.toLowerCase();

if(!query){

home();

return;

}

document.getElementById("app").innerHTML=`

<div class="crumb">

<button
class="back"
onclick="home()"
>
← BACK
</button>

<h1>
SEARCH
</h1>

</div>

<div class="loading">
Searching manufacturer directories...
</div>

`;


const results=[];


/* -----------------------------------------
   SEARCH ALL MANUFACTURERS

   Each manufacturer root is loaded.

   Only PDFs in that directory are indexed here.
   Folder navigation remains available separately.
----------------------------------------- */

for(
const manufacturer of manufacturers
){

try{

const url =
manufacturerURL(
manufacturer
);

const items =
await getDirectory(url);

items.forEach(function(item){

if(!item.pdf) return;

const searchText = (

manufacturer +
" " +
item.name

).toLowerCase();

if(
searchText.includes(query)
){

results.push({

manufacturer:
manufacturer,

name:
item.name,

url:
item.url

});

}

});

}catch(error){

console.warn(
"Search failed for",
manufacturer,
error
);

}

}


/* -----------------------------------------
   RENDER SEARCH RESULTS
----------------------------------------- */

let html=`

<div class="crumb">

<button
class="back"
onclick="home()"
>
← BACK
</button>

<h1>
SEARCH
</h1>

</div>

<p>
${results.length}
document${results.length === 1 ? "" : "s"}
found
</p>

`;

if(results.length){

results.forEach(function(item){

html+=createDocument(

item.manufacturer,

item.name,

item.url,

""

);

});

}else{

html+=`

<div class="notice">

No indexed document matched that search.

<br><br>

Try searching for a manufacturer or model such as:

<strong>Dorma</strong>,
<strong>ED900</strong>,
<strong>ED700</strong>,
<strong>Besam</strong>,
<strong>Record</strong>,
or
<strong>Tormax</strong>.

</div>

`;

}

document.getElementById("app").innerHTML=html;

}


/* =========================================================
   START
========================================================= */

home();

</script>

</body>
</html>
